<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Two college best friends sitting together under a tree">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ee"/><stop offset=".7" stop-color="#e8f5ee"/><stop offset="1" stop-color="#fff1e0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6cf" stop-opacity=".95"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9dcae"/><stop offset="1" stop-color="#8fc29a"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5d29a"/><stop offset="1" stop-color="#6fae7e"/></linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation=".6"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .08 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  </defs>

  <!-- sky -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <circle cx="690" cy="120" r="150" fill="url(#sun)"/>
  <circle cx="690" cy="120" r="42" fill="#fff3bf" opacity=".9"/>

  <!-- drifting clouds -->
  <g fill="#fff" opacity=".92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="22s" repeatCount="indefinite"/>
      <ellipse cx="170" cy="90" rx="70" ry="22"/><ellipse cx="215" cy="75" rx="48" ry="26"/><ellipse cx="130" cy="78" rx="38" ry="20"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 0;0 0" dur="28s" repeatCount="indefinite"/>
      <ellipse cx="520" cy="170" rx="80" ry="24"/><ellipse cx="570" cy="152" rx="54" ry="28"/><ellipse cx="470" cy="160" rx="42" ry="20"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;30 0;0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="790" cy="230" rx="60" ry="18"/><ellipse cx="825" cy="216" rx="40" ry="20"/>
    </g>
  </g>

  <!-- distant hills -->
  <path d="M0 330 Q120 270 260 320 T520 310 T780 300 T900 320 V520 H0Z" fill="#cde7c9" opacity=".9"/>
  <!-- little cottage in the distance -->
  <g transform="translate(690 285)" opacity=".95">
    <rect x="0" y="12" width="46" height="30" fill="#fff4e2"/>
    <path d="M-6 14 L23 -8 L52 14Z" fill="#e58b86"/>
    <rect x="18" y="24" width="10" height="18" fill="#b98b5e"/>
    <rect x="6" y="20" width="8" height="8" fill="#9ad0e2"/>
  </g>
  <!-- mid hill -->
  <path d="M0 360 Q200 300 400 350 T900 340 V520 H0Z" fill="url(#hill1)"/>
  <!-- front hill -->
  <path d="M0 410 Q250 360 480 400 T900 395 V520 H0Z" fill="url(#hill2)"/>

  <!-- grass tufts & flowers -->
  <g stroke="#5f9c6c" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M60 470 q-3 -16 -8 -22 M60 470 q2 -14 8 -20 M60 470 q8 -8 16 -10"/>
    <path d="M820 480 q-3 -16 -8 -22 M820 480 q2 -14 8 -20"/>
    <path d="M610 455 q-3 -14 -8 -18 M610 455 q2 -12 8 -16"/>
  </g>
  <g>
    <g fill="#fff"><circle cx="130" cy="455" r="4"/><circle cx="136" cy="450" r="4"/><circle cx="142" cy="455" r="4"/><circle cx="136" cy="460" r="4"/></g><circle cx="136" cy="455" r="3" fill="#f5d98b"/>
    <g fill="#f9b9c8"><circle cx="740" cy="470" r="4"/><circle cx="746" cy="465" r="4"/><circle cx="752" cy="470" r="4"/><circle cx="746" cy="475" r="4"/></g><circle cx="746" cy="470" r="3" fill="#f5d98b"/>
    <g fill="#fff"><circle cx="230" cy="490" r="3.5"/><circle cx="235" cy="486" r="3.5"/><circle cx="240" cy="490" r="3.5"/><circle cx="235" cy="494" r="3.5"/></g><circle cx="235" cy="490" r="2.5" fill="#f5d98b"/>
    <g fill="#f9b9c8"><circle cx="560" cy="490" r="3.5"/><circle cx="565" cy="486" r="3.5"/><circle cx="570" cy="490" r="3.5"/><circle cx="565" cy="494" r="3.5"/></g><circle cx="565" cy="490" r="2.5" fill="#f5d98b"/>
  </g>

  <!-- big tree on the left -->
  <g>
    <path d="M168 440 C172 360 160 300 176 230 L204 230 C214 300 206 360 214 440Z" fill="#8a6446"/>
    <path d="M186 300 q-30 -20 -48 -50" stroke="#8a6446" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-0.8 190 230;0.8 190 230;-0.8 190 230" dur="6s" repeatCount="indefinite"/>
      <circle cx="190" cy="170" r="92" fill="#7cbf86"/>
      <circle cx="120" cy="210" r="62" fill="#8ccb91"/>
      <circle cx="262" cy="206" r="66" fill="#6fb37d"/>
      <circle cx="165" cy="110" r="54" fill="#9bd69d"/>
      <circle cx="235" cy="120" r="50" fill="#86c98f"/>
      <!-- blossoms in the tree -->
      <g fill="#f9b9c8" opacity=".95">
        <circle cx="140" cy="150" r="5"/><circle cx="210" cy="100" r="5"/><circle cx="250" cy="180" r="5"/><circle cx="100" cy="215" r="5"/><circle cx="180" cy="200" r="5"/><circle cx="230" cy="230" r="5"/><circle cx="160" cy="90" r="4"/>
      </g>
    </g>
  </g>

  <!-- friend swing-free picnic blanket -->
  <ellipse cx="520" cy="452" rx="190" ry="26" fill="#f7c9d3"/>
  <ellipse cx="520" cy="452" rx="190" ry="26" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 10" opacity=".8"/>

  <!-- ===== Friend 1 (left, hair in a bun, pink kurta) ===== -->
  <g transform="translate(470 455)">
    <!-- legs/skirt -->
    <path d="M-62 -4 C-50 -30 40 -30 62 -4 C70 6 -70 6 -62 -4Z" fill="#e98fa6"/>
    <ellipse cx="-50" cy="2" rx="16" ry="7" fill="#f5d1b8"/> <!-- shoes -->
    <!-- body -->
    <path d="M-36 -12 C-40 -70 -30 -118 0 -124 C30 -118 40 -70 36 -12Z" fill="#f4a6b8"/>
    <path d="M-36 -12 C-40 -70 -30 -118 0 -124 C-8 -90 -12 -40 -10 -12Z" fill="#fff" opacity=".18"/>
    <!-- dupatta -->
    <path d="M-22 -118 C-10 -90 10 -80 30 -64" stroke="#fde9a6" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="-8" y="-136" width="16" height="16" rx="6" fill="#f5d1b8"/>
    <!-- arm around friend -->
    <path d="M26 -108 C60 -118 84 -112 104 -104" stroke="#f5d1b8" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <g transform="translate(0 -168) rotate(6)">
      <circle cx="0" cy="-26" r="22" fill="#4a3326"/> <!-- bun -->
      <circle cx="0" cy="0" r="38" fill="#4a3326"/>
      <circle cx="0" cy="6" r="33" fill="#f5d1b8"/>
      <path d="M-35 0 C-34 -34 34 -38 35 0 C22 -20 -6 -24 -35 0Z" fill="#4a3326"/>
      <path d="M-14 8 q5 -7 11 0" stroke="#3a2a22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M5 8 q5 -7 11 0" stroke="#3a2a22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-20" cy="20" r="6" fill="#f7a1b6" opacity=".6"/><circle cx="21" cy="20" r="6" fill="#f7a1b6" opacity=".6"/>
      <path d="M-7 22 q7 8 14 0" stroke="#c9576f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="-20" r="6" fill="#f9b9c8"/><circle cx="30" cy="-20" r="2.5" fill="#f5d98b"/> <!-- hair flower -->
    </g>
  </g>

  <!-- ===== Friend 2 (right, long hair, yellow dress) ===== -->
  <g transform="translate(578 457)">
    <path d="M-64 -4 C-50 -30 44 -30 64 -4 C72 6 -72 6 -64 -4Z" fill="#f2c960"/>
    <ellipse cx="52" cy="2" rx="16" ry="7" fill="#e8b894"/>
    <!-- long hair back -->
    <path d="M-40 -170 C-62 -150 -58 -80 -44 -56 L44 -56 C58 -80 62 -150 40 -170Z" fill="#1f1a24"/>
    <path d="M-34 -12 C-38 -70 -28 -116 0 -122 C28 -116 38 -70 34 -12Z" fill="#ffd97a"/>
    <path d="M-34 -12 C-38 -70 -28 -116 0 -122 C-8 -90 -12 -40 -10 -12Z" fill="#fff" opacity=".2"/>
    <!-- collar / ribbon -->
    <path d="M-12 -118 L0 -100 L12 -118" fill="#fff" stroke="#fff" stroke-width="2"/>
    <rect x="-8" y="-134" width="16" height="16" rx="6" fill="#e8b894"/>
    <!-- arm around friend (behind, shown on the left side) -->
    <path d="M-26 -104 C-52 -100 -72 -102 -92 -108" stroke="#e8b894" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- head tilted toward friend -->
    <g transform="translate(0 -166) rotate(-9)">
      <circle cx="0" cy="0" r="38" fill="#1f1a24"/>
      <circle cx="0" cy="6" r="33" fill="#e8b894"/>
      <path d="M-36 6 C-38 -36 38 -40 36 6 C26 -14 4 -16 -4 -10 C-12 -18 -28 -14 -36 6Z" fill="#1f1a24"/>
      <path d="M-14 9 q5 -7 11 0" stroke="#2a1f20" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M5 9 q5 -7 11 0" stroke="#2a1f20" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-20" cy="21" r="6" fill="#f08aa3" opacity=".55"/><circle cx="21" cy="21" r="6" fill="#f08aa3" opacity=".55"/>
      <path d="M-8 23 q8 9 16 0" stroke="#c9576f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- hairclip -->
      <path d="M-22 -16 l8 -6 l2 8z" fill="#f9b9c8"/>
    </g>
  </g>

  <!-- picnic basket -->
  <g transform="translate(655 440)">
    <path d="M0 0 h50 l-5 28 h-40z" fill="#c98d5a"/>
    <path d="M6 0 C6 -24 44 -24 44 0" stroke="#a8703f" stroke-width="4" fill="none"/>
    <path d="M10 8 h30 M12 16 h26" stroke="#e2b17f" stroke-width="2"/>
  </g>

  <!-- floating little hearts -->
  <g fill="#f48fb1">
    <path d="M524 262 c-6 -12 -22 -4 -12 8 l12 12 l12 -12 c10 -12 -6 -20 -12 -8z" opacity=".9">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M590 292 c-4 -8 -14 -3 -8 5 l8 8 l8 -8 c6 -8 -4 -13 -8 -5z" opacity=".7" transform="scale(.9)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- falling petals -->
  <g fill="#f9b9c8">
    <ellipse cx="300" cy="60" rx="5" ry="3">
      <animateMotion dur="9s" repeatCount="indefinite" path="M0 0 C40 120 -30 260 20 400"/>
    </ellipse>
    <ellipse cx="420" cy="30" rx="5" ry="3">
      <animateMotion dur="11s" repeatCount="indefinite" begin="2s" path="M0 0 C-50 140 30 280 -20 420"/>
    </ellipse>
    <ellipse cx="640" cy="50" rx="5" ry="3">
      <animateMotion dur="10s" repeatCount="indefinite" begin="4s" path="M0 0 C30 120 -40 250 10 400"/>
    </ellipse>
    <ellipse cx="760" cy="80" rx="5" ry="3">
      <animateMotion dur="12s" repeatCount="indefinite" begin="1s" path="M0 0 C-30 130 40 270 -10 380"/>
    </ellipse>
  </g>

  <!-- watercolor paper texture overlay -->
  <rect width="900" height="520" filter="url(#paper)" opacity=".7"/>
</svg>
